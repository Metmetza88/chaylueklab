<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0F">
<title>Chaylueklab Vault</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a0f;--line:rgba(255,255,255,.08);--text:#f5f8fb;--muted:#8492a6;--gold:#ddb96e;--cyan:#65e8f2}
*{box-sizing:border-box}
body{margin:0;font-family:Prompt,sans-serif;background:
radial-gradient(circle at 10% -8%,rgba(101,232,242,.12),transparent 25%),
radial-gradient(circle at 90% 0,rgba(221,185,110,.11),transparent 28%),
linear-gradient(180deg,#070a0f,#09111a 46%,#070a0f);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(7,10,15,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(221,185,110,.15)}
.head{max-width:760px;margin:auto;padding:12px 14px;display:flex;align-items:center;gap:11px}
.logo{width:44px;height:44px;border-radius:14px;object-fit:cover;border:1px solid rgba(221,185,110,.28);background:#101720}
.head h1{font-size:15px;margin:0;letter-spacing:.06em}.head small{display:block;color:#768599;font-size:9px}
main{max-width:760px;margin:auto;padding:14px}
.hero{border:1px solid rgba(221,185,110,.16);background:linear-gradient(145deg,rgba(17,27,40,.96),rgba(9,14,22,.96));border-radius:26px;padding:18px}
.hero h2{margin:0;font-size:24px}.hero p{margin:6px 0 0;color:#8796aa;font-size:10px;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.tab{border:1px solid var(--line);background:#0d1520;color:#728195;border-radius:16px;padding:11px;font-weight:600}
.tab.active{color:#091116;background:linear-gradient(135deg,#f2d99f,#d8b56b);border-color:transparent}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;border:1px solid var(--line);background:#0a1018;color:#fff;border-radius:14px;padding:11px 12px;outline:none}
.btn{border:0;border-radius:14px;padding:11px 13px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,#65e8f2,#45cfd9);color:#071015}
.btn.gold{background:linear-gradient(135deg,#f2d99f,#d8b56b);color:#171208}
.storage{border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px;background:rgba(255,255,255,.025)}
.storage-top{display:flex;justify-content:space-between;font-size:9px;color:#8796aa}
.bar{height:8px;border-radius:99px;background:#151e29;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ddb96e,#65e8f2)}
.list{display:grid;gap:9px}
.card{border:1px solid var(--line);background:linear-gradient(145deg,#101925,#0b111a);border-radius:18px;padding:13px;display:flex;align-items:center;gap:11px}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(101,232,242,.08);font-size:19px}
.meta{min-width:0;flex:1}.meta b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{font-size:8px;color:#718095}
.actions{display:flex;gap:6px}.actions button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#0a1119;color:#8ca0b3}.actions button.del{color:#ff8c96}
.empty{text-align:center;color:#66768a;font-size:10px;padding:35px 10px}
.note-box{border:1px solid var(--line);background:#0b1119;border-radius:18px;padding:13px;margin-bottom:12px}
.note-box textarea{width:100%;min-height:90px;resize:vertical;border:0;outline:none;background:transparent;color:white;font:inherit;font-size:11px}
.loading{position:fixed;inset:0;display:none;place-items:center;background:#05080dc9;z-index:50}.loading.show{display:grid}
.spin{width:36px;height:36px;border:3px solid #26313d;border-top-color:#65e8f2;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;transition:.2s;background:#101924;border:1px solid rgba(101,232,242,.18);border-radius:13px;padding:10px 13px;font-size:9px;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}
input[type=file]{display:none}
</style>
</head>
<body>
<header><div class="head"><img id="brandLogo" class="logo" alt=""><div><h1>Chaylueklab Vault</h1><small>NOTES • FILES • PRIVATE STORAGE</small></div></div></header>
<main>
<section class="hero"><h2>คลังของฉัน</h2><p>เก็บโน้ต รูป สลิป PDF และไฟล์สำคัญไว้กับบัญชี LINE เปิดจากเครื่องไหนก็เจอ</p></section>

<div class="tabs">
<button id="tabNotes" class="tab" onclick="switchTab('notes')">โน้ต</button>
<button id="tabFiles" class="tab active" onclick="switchTab('files')">ไฟล์</button>
</div>

<section id="filesView">
<div class="storage">
<div class="storage-top"><span>พื้นที่จัดเก็บ</span><span id="storageText">0 MB / 10 MB</span></div>
<div class="bar"><i id="storageBar"></i></div>
</div>
<div class="toolbar">
<input id="fileSearch" class="search" placeholder="ค้นหาไฟล์..." oninput="renderFiles()">
<button class="btn primary" onclick="fileInput.click()">+ เพิ่มไฟล์</button>
<input id="fileInput" type="file" onchange="uploadFile(this.files[0])">
</div>
<div id="fileList" class="list"></div>
</section>

<section id="notesView" style="display:none">
<div class="note-box">
<textarea id="noteText" placeholder="พิมพ์โน้ตที่อยากเก็บไว้..."></textarea>
<button class="btn gold" style="width:100%" onclick="saveNote()">บันทึกโน้ต</button>
</div>
<div class="toolbar"><input id="noteSearch" class="search" placeholder="ค้นหาโน้ต..." oninput="renderNotes()"></div>
<div id="noteList" class="list"></div>
</section>
</main>

<div id="loading" class="loading"><div class="spin"></div></div>
<div id="toast" class="toast"></div>

<script>
const LIFF_ID='2011681452-k1lfYGsF';
const API='https://bxaplhrunxiadjsdobyl.supabase.co/functions/v1/liff-vault';
let accessToken='',idToken='',files=[],notes=[],storage={usedBytes:0,limitBytes:10485760};
const $=id=>document.getElementById(id);

function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function load(v){$('loading').classList.toggle('show',v)}
function fmtBytes(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function fmtDate(s){return new Date(s).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function iconFor(m,n){if((m||'').startsWith('image/'))return '🖼️';if((m||'').includes('pdf'))return '📕';if(/xls|csv|sheet/i.test((m||'')+(n||'')))return '📊';return '📎'}

async function api(action,extra={}){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,idToken,accessToken,...extra})});
 const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'request_failed');return j
}

async function init(){
 load(true);
 try{
   await liff.init({liffId:LIFF_ID});
   if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
   accessToken=liff.getAccessToken()||'';
   idToken=liff.getIDToken()||'';
   const tab=new URLSearchParams(location.search).get('tab');
   switchTab(tab==='notes'?'notes':'files',false);
   await refresh();
 }catch(e){toast('เปิดคลังไม่สำเร็จ')}
 finally{load(false)}
}

async function refresh(){
 const j=await api('list');
 files=j.files||[];notes=j.notes||[];storage=j.storage||storage;
 if(j.brandPictureUrl)$('brandLogo').src=j.brandPictureUrl;
 renderFiles();renderNotes();renderStorage()
}

function renderStorage(){
 const p=Math.min(100,(storage.usedBytes/storage.limitBytes)*100||0);
 $('storageBar').style.width=p+'%';
 $('storageText').textContent=fmtBytes(storage.usedBytes)+' / '+fmtBytes(storage.limitBytes)
}

function renderFiles(){
 const q=$('fileSearch').value.trim().toLowerCase();
 const arr=files.filter(f=>(f.file_name||'').toLowerCase().includes(q));
 $('fileList').innerHTML=arr.length?arr.map(f=>
 '<div class="card"><div class="ico">'+iconFor(f.mime_type,f.file_name)+'</div>'+
 '<div class="meta"><b>'+esc(f.file_name)+'</b><small>'+fmtBytes(f.size_bytes)+' • '+fmtDate(f.created_at)+'</small></div>'+
 '<div class="actions"><button onclick="openFile(\''+f.id+'\')">↗</button><button class="del" onclick="deleteFile(\''+f.id+'\')">×</button></div></div>'
 ).join(''):'<div class="empty">ยังไม่มีไฟล์ในคลัง</div>'
}

function renderNotes(){
 const q=$('noteSearch').value.trim().toLowerCase();
 const arr=notes.filter(n=>(n.note||'').toLowerCase().includes(q));
 $('noteList').innerHTML=arr.length?arr.map(n=>
 '<div class="card"><div class="ico">📝</div><div class="meta"><b style="white-space:normal">'+esc(n.note)+'</b><small>'+fmtDate(n.created_at)+'</small></div>'+
 '<div class="actions"><button class="del" onclick="deleteNote(\''+n.id+'\')">×</button></div></div>'
 ).join(''):'<div class="empty">ยังไม่มีโน้ต</div>'
}

function switchTab(tab,push=true){
 const f=tab==='files';
 $('filesView').style.display=f?'block':'none';
 $('notesView').style.display=f?'none':'block';
 $('tabFiles').classList.toggle('active',f);
 $('tabNotes').classList.toggle('active',!f);
 if(push){const u=new URL(location.href);u.searchParams.set('tab',tab);history.replaceState(null,'',u)}
}

async function uploadFile(file){
 if(!file)return;
 if(file.size>10485760)return toast('ไฟล์ต้องไม่เกิน 10 MB');
 load(true);
 try{
   const fd=new FormData();
   fd.append('idToken',idToken);fd.append('accessToken',accessToken);fd.append('file',file);
   const r=await fetch(API,{method:'POST',body:fd}),j=await r.json();
   if(!r.ok||!j.ok)throw new Error();
   toast('เก็บไฟล์แล้ว');$('fileInput').value='';await refresh()
 }catch{toast('อัปโหลดไม่สำเร็จ')}finally{load(false)}
}

async function saveNote(){
 const note=$('noteText').value.trim();if(!note)return toast('พิมพ์โน้ตก่อน');
 load(true);
 try{await api('create_note',{note});$('noteText').value='';toast('บันทึกโน้ตแล้ว');await refresh()}
 catch{toast('บันทึกไม่ได้')}finally{load(false)}
}

function openFile(id){const f=files.find(x=>x.id===id);if(f&&f.url)location.href=f.url}

async function deleteFile(id){
 if(!confirm('ลบไฟล์นี้?'))return;
 load(true);try{await api('delete_file',{id});await refresh()}finally{load(false)}
}
async function deleteNote(id){
 if(!confirm('ลบโน้ตนี้?'))return;
 load(true);try{await api('delete_note',{id});await refresh()}finally{load(false)}
}
init();
</script>
</body>
</html>
