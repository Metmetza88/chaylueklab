<html lang="th">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaylueklab LIFF</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#E8D9A0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,#1A1810,#121212);border:1px solid #D4AF37;border-radius:24px;padding:28px;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(212,175,55,.25)}
.card:before{content:'';position:absolute;inset:-2px;background:linear-gradient(90deg,#D4AF37,#FFD700,#D4AF37);border-radius:24px;z-index:-1;animation:rotate 3s linear infinite;opacity:.5}
@keyframes rotate{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(60deg)}}
.badge{display:inline-block;font-size:10px;letter-spacing:2px;color:#D4AF37;background:#1E1A12;border:1px solid #2A2418;border-radius:20px;padding:4px 10px;margin-bottom:14px}
h1{font-size:22px;color:#D4AF37;margin-bottom:6px}
.sub{font-size:13px;color:#8A7D5E;margin-bottom:20px}
.taskBox{background:#0F0E0B;border:1px solid #2A2418;border-radius:16px;padding:16px;margin-bottom:20px}
.taskBox label{font-size:11px;letter-spacing:1px;color:#5A5240}
.taskBox div{font-size:18px;margin-top:6px;color:#fff;font-weight:700}
.time{color:#00FF94;font-size:14px;margin-top:8px}
.btns{display:flex;gap:12px}
.btn{flex:1;height:48px;border-radius:999px;border:none;font-weight:700;cursor:pointer}
.btn-close{background:#1A1A1A;color:#8A7D5E;border:1px solid #2A2418}
.btn-snooze{background:linear-gradient(100deg,#D4AF37,#FFD700);color:#0A0A0A}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1A1810;border:1px solid #D4AF37;padding:12px 20px;border-radius:999px;display:none;z-index:99}
</style>
</head>
<body>
<div class="card">
<div class="badge" id="badge">SNOOZE MODE</div>
<h1>เลื่อนเตือนอีก 10 นาที</h1>
<p class="sub">Chaylueklab • LINE LIFF</p>
<div class="taskBox">
<label>ภารกิจ</label>
<div id="taskText">สรุปโปรเจกต์ Chaylueklab</div>
<div class="time" id="timeText">จะเตือนใหม่เวลา 04:13 น.</div>
</div>
<div class="btns">
<button class="btn btn-close" onclick="closeWin()">ปิด</button>
<button class="btn btn-snooze" onclick="snooze()">เลื่อน 10 นาที ↗</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const LIFF_ID = "2011681452-yexLrODy";
let taskName = "สรุปโปรเจกต์ Chaylueklab";
let displayTime = "";
function getParam(n){return new URLSearchParams(location.search).get(n)}
function init(){
  const t = getParam('task');
  if(t) taskName = decodeURIComponent(t);
  document.getElementById('taskText').innerText = taskName;
  let nt = getParam('newTime') || getParam('time');
  if(nt){
    displayTime = nt.replace('น.','').trim();
  } else {
    const d = new Date(Date.now()+10*60000);
    displayTime = d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
  }
  document.getElementById('timeText').innerText = 'จะเตือนใหม่เวลา '+displayTime+' น.';
  const hasParam = getParam('task')||getParam('newTime')||getParam('time');
  if(hasParam) document.getElementById('badge').innerText = 'มาจาก LINE BOT • '+displayTime+' น.';
  if(LIFF_ID!=="YOUR_LIFF_ID_HERE" && window.liff){
    liff.init({liffId:LIFF_ID}).catch(()=>{});
  }
}
function showToast(m){
  const el=document.getElementById('toast');
  el.innerText=m; el.style.display='block';
  setTimeout(()=>el.style.display='none',2500);
}
function snooze(){
  const msg = `เลื่อน: ${taskName} → ${displayTime} น.`;
  if(window.liff && liff.isInClient && liff.isInClient() && liff.sendMessages){
    liff.sendMessages([{type:'text',text:msg}]).then(()=>{
      showToast('ส่งแล้ว: '+displayTime+' น.');
      setTimeout(()=>liff.closeWindow(),700);
    }).catch(()=>{ showToast(msg); });
  } else {
    showToast(msg);
    if(window.liff && liff.closeWindow){ try{liff.closeWindow()}catch(e){} }
  }
}
function closeWin(){
  if(window.liff && liff.closeWindow){ try{liff.closeWindow()}catch(e){} }
  showToast('ปิดแล้ว');
}
init();
</script>

</html>
