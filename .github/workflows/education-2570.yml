name: Education 2570 - Quality and Safe Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'education-2570/**'
      - '.github/workflows/education-2570.yml'
  push:
    branches: [main]
    paths:
      - 'education-2570/**'
      - '.github/workflows/education-2570.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: education-2570-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Unit Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: education-2570/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: education-2570
      - name: Lint / syntax check
        run: npm run lint
        working-directory: education-2570
      - name: Automated tests
        run: npm test
        working-directory: education-2570
      - name: Build
        run: npm run build
        working-directory: education-2570

  deploy:
    name: Stage, smoke test, promote Education only
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EDU_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: education-production
    env:
      VERCEL_ORG_ID: ${{ vars.EDU_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.EDU_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.EDU_VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.EDU_VERCEL_CLI_VERSION }}
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_ORG_ID:?missing EDU_VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID:?missing EDU_VERCEL_PROJECT_ID}"
          test -n "${VERCEL_TOKEN:?missing EDU_VERCEL_TOKEN}"
          [[ "${VERCEL_CLI_VERSION:?missing EDU_VERCEL_CLI_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Install reviewed Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Pull only Education project configuration
        run: vercel pull --yes --environment=production
        working-directory: education-2570
      - name: Build with Vercel
        run: vercel build --prod
        working-directory: education-2570
      - name: Stage production without changing any domain
        id: stage
        shell: bash
        working-directory: education-2570
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$DEPLOYMENT_URL" node --input-type=module -e '
            const url = new URL(process.env.DEPLOYMENT_URL);
            if (url.protocol !== "https:" || url.origin !== process.env.DEPLOYMENT_URL || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Verify staged static page
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          BYPASS_SECRET: ${{ secrets.EDU_VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "$BYPASS_SECRET" ]]; then
            curl --fail --silent --show-error --retry 3 --header "x-vercel-protection-bypass: ${BYPASS_SECRET}" "$DEPLOYMENT_URL" | grep -q 'EDUCATION 2570'
          else
            curl --fail --silent --show-error --retry 3 "$DEPLOYMENT_URL" | grep -q 'EDUCATION 2570'
          fi
      - name: Promote tested release
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL"
        working-directory: education-2570
