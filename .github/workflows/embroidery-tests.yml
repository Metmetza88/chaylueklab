name: Embroidery module checks
on:
  push:
    branches: [feature/woramet-dojo-mvp-20261113]
    paths: ['embroidery/**', 'assets/embroidery/**', 'embroidery-studio.html', 'api/embroidery.py', 'requirements.txt', '.python-version', 'vercel.json', 'tests/embroidery-studio.test.mjs', '.github/workflows/embroidery-tests.yml']
  pull_request:
    paths: ['embroidery/**', 'assets/embroidery/**', 'embroidery-studio.html', 'api/embroidery.py', 'requirements.txt', '.python-version', 'vercel.json', 'tests/embroidery-studio.test.mjs', '.github/workflows/embroidery-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embroidery:
    name: Embroidery software round-trip (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s embroidery/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Existing site regression and public build
        if: runner.os == 'Linux'
        run: |
          node --test tests/*.test.mjs
          node scripts/build-public-site.mjs
