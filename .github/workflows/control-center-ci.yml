name: Control Center CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'control.html'
      - 'control.js'
      - 'stock.html'
      - 'assets/stock*'
      - 'data/*config.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/control-center-ci.yml'
  push:
    branches: [codex/retail-control-center, fix/control-center-plus59]
    paths:
      - 'control.html'
      - 'control.js'
      - 'stock.html'
      - 'assets/stock*'
      - 'data/*config.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/control-center-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control-center:
    name: Validate CHAYLUEKLAB Control Center
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        id: syntax
        run: node --check control.js

      - name: Run automated tests
        id: tests
        run: node --test tests/*.test.mjs

      - name: Verify required Control Center files
        id: configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-control.mjs
          git diff --exit-code -- control.html
          node scripts/verify-public-site.mjs

      - name: Write CI summary
        if: always()
        env:
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CONFIG_RESULT: ${{ steps.configuration.outcome }}
        run: |
          {
            echo "## CHAYLUEKLAB Control Center CI"
            echo
            echo "- JavaScript syntax: $SYNTAX_RESULT"
            echo "- Automated tests: $TEST_RESULT"
            echo "- Public files, existing LIFF and shared Stock: $CONFIG_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
