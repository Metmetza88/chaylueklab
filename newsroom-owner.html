<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>กองบรรณาธิการ · CHAYLUEKLAB</title><link rel="stylesheet" href="assets/newsroom.css"><link rel="stylesheet" href="assets/newsroom-owner.css"><script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script><script type="module" src="assets/newsroom-owner.js"></script></head>
<body><header class="header"><a class="brand" href="index.html">CHAYLUEKLAB<small>EDITORIAL DESK</small></a><a href="newsroom.html">ดูหน้าข่าว →</a></header><main class="shell"><section class="hero"><div class="eyebrow">OWNER WORKSPACE</div><h1>กองบรรณาธิการ</h1><p>ฉบับร่าง → ตรวจข้อเท็จจริง → เกลางาน → อนุมัติ → เผยแพร่<br>ทุกข่าวต้องได้รับอนุมัติจากเจ้าของก่อนขึ้นเว็บไซต์</p><button id="loginOwner" class="button primary">เข้าสู่ระบบด้วยบัญชี LINE เดิม</button><p id="ownerStatus" role="status" aria-live="polite"></p></section>
<section id="ownerDesk" class="owner-desk" hidden><aside><button id="newStory" class="button">เสนอข่าวใหม่</button><div id="ownerStories" class="owner-list"></div></aside><div class="editor-panel"><p id="storyState" class="eyebrow"></p><form id="storyForm"><label for="storyTitle">หัวข้อข่าว</label><input id="storyTitle" required maxlength="300"><div class="editor-row"><div><label for="storySlug">Slug (ภาษาอังกฤษ)</label><input id="storySlug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" maxlength="100"></div><div><label for="storyCategory">หมวด</label><select id="storyCategory"></select></div></div><label for="storyReporter">นักข่าวที่รับผิดชอบ</label><input id="storyReporter" maxlength="200"><label for="storySummary">สรุปข่าว</label><textarea id="storySummary" rows="3" maxlength="1500"></textarea><label for="storyBody">เนื้อหาข่าว</label><textarea id="storyBody" rows="9" maxlength="50000"></textarea><label for="storySources">แหล่งอ้างอิง (หนึ่ง URL ต่อบรรทัด)</label><textarea id="storySources" rows="3"></textarea><label for="storySocial">Social / LINE copy</label><textarea id="storySocial" rows="4" maxlength="8000"></textarea><label for="storyImageBrief">บรีฟภาพสำหรับ AI Studio</label><textarea id="storyImageBrief" rows="4" maxlength="8000"></textarea><div class="editor-row"><div><label for="storyMediaUrl">ภาพ / วิดีโอที่ได้จาก Studio (HTTPS)</label><input id="storyMediaUrl" type="url" maxlength="2048"></div><div><label for="storyMediaType">ประเภทสื่อ</label><select id="storyMediaType"><option value="image">ภาพ</option><option value="video">วิดีโอ</option></select></div></div><button id="saveStory" type="submit" class="button primary" data-write>บันทึกฉบับร่าง</button></form><div class="review-actions"><label for="reviewNote">บันทึกการตรวจ / เหตุผลส่งกลับ</label><textarea id="reviewNote" rows="2" maxlength="2000"></textarea><div class="actions"><select id="nextStatus" aria-label="สถานะถัดไป"></select><button id="transitionStory" class="button" data-write>ส่งต่อขั้นตอน</button><button id="factcheckStory" class="button" data-write>ยืนยันการตรวจข้อเท็จจริง</button><button id="approveStory" class="button primary" data-write>เจ้าของอนุมัติฉบับนี้</button><button id="publishStory" class="button primary" data-write>เผยแพร่ข่าวที่อนุมัติแล้ว</button></div></div><details class="handoff"><summary>ส่งต่อ Studio / เตรียม LINE</summary><p id="studioBrief" class="story-content"></p><button id="copyImageBrief" class="button">คัดลอกบรีฟภาพ</button> <a class="button" href="ai-video.html">เปิด AI Studio</a><p id="lineDraft" class="story-content"></p><button id="copyLine" class="button">คัดลอกข้อความ LINE</button><p class="summary">ระบบเตรียมข้อความให้ตรวจและนำไปส่งเอง ไม่มีการโพสต์อัตโนมัติ</p></details></div></section></main></body></html>
