  const KEY='satuek-connect:v1';let db,storageIssue='',route='',searchScope='all',query='',area='',category='',savedOnly=false,helpStatus='',lastFocus=null,formOpened=0;

  function validateDB(d){
    if(!d||d.version!==1||typeof d.owner!=='string'||!d.limits||typeof d.limits!=='object'||Array.isArray(d.limits))return false;

  function plansPage(){return `<div class="page-title"><div><div class="eyebrow">${icon('shop')} เติบโตไปด้วยกัน</div><h1>โอกาสใหม่ของธุรกิจบ้านเรา</h1><p>แพ็กเกจที่ออกแบบสำหรับร้านค้าและช่างในสตึก</p></div></div><div class="notice" style="margin-bottom:22px">แสดงราคาเพื่อวางแผนเท่านั้น ยังไม่รับชำระเงิน การสมัครเป็นเพียงบันทึกความสนใจในเครื่อง ไม่ใช่การเปิดสิทธิ์หรือส่งคำขอให้ทีมงาน</div><div class="plans">${PLANS.map(([id,name,price,period,desc])=>`<article class="plan ${id==='shop'?'featured':''}"><span class="pill ${id==='shop'?'green':''}">${id==='shop'?'สำหรับร้านค้าชุมชน':'แพ็กเกจธุรกิจ'}</span><h2 style="font-size:21px;margin-top:15px">${name}</h2><div class="price">${price?'฿'+price:'ฟรี'}<small>${price?'/ '+period:''}</small></div><p>${desc} · ${period}</p><button class="btn ${id==='shop'?'':'secondary'}" data-action="plan" data-id="${id}">${price?'สมัครใช้บริการ (ทดลอง)':'เริ่มลงประกาศฟรี'}</button></article>`).join('')}</div>`;}

  function modal(title,body){lastFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;formOpened=Date.now();if(!$('#modal').open)$('#modal').showModal();}

  function listingForm(type,id=''){const data=type==='product'?db.products:db.services;const x=id?data.find(v=>v.id===id&&owned(v)):null;if(id&&!x)return toast('แก้ไขได้เฉพาะประกาศของคุณในเครื่องนี้');const isProduct=type==='product';const title=x?'แก้ไขประกาศ':isProduct?'ลงขายสินค้า (ทดลอง)':'ลงบริการ (ทดลอง)';modal(title,`<p>บันทึกให้คุณทดลองในเครื่องเท่านั้น ยังไม่มีการเผยแพร่หรือยืนยันตัวตน ช่องทางติดต่อที่กรอกจะรอยืนยันและยังไม่มีปุ่มโทรหรือ LINE</p>`+formShell(type,`<label class="form-field">${isProduct?'ชื่อสินค้า':'ชื่อบริการ'} *<input class="field" name="title" value="${esc(x?.title)}" required minlength="3" maxlength="90" placeholder="${isProduct?'เช่น ข้าวหอมมะลิจากสวน':'เช่น บริการซ่อมประปา'}"></label><div class="form-grid"><label class="form-field">หมวดหมู่ *<select class="field" name="category" required>${selectOptions(isProduct?PRODUCT_TYPES:SERVICE_TYPES,x?.category,'เลือกหมวดหมู่')}</select></label><label class="form-field">พื้นที่${isProduct?'สินค้า':'ให้บริการ'} *<select class="field" name="area" required>${areaOptions(x?.area||'',false)}</select></label></div>${isProduct?`<div class="form-grid"><label class="form-field">ราคา (บาท) *<input class="field" name="price" type="number" min="0" max="10000000" step="0.01" required value="${x?x.price:''}" inputmode="decimal"></label><label class="form-field">หน่วย *<input class="field" name="unit" maxlength="20" required value="${esc(x?.unit)}" placeholder="กก. / ชิ้น / แพ็ก"></label></div><label class="form-field">ภาพประกอบ<select class="field" name="image">${['rice.webp','fish.webp','vegetables.webp','bamboo.webp'].map((image,i)=>`<option value="${image}"${x?.image===image?' selected':''}>${['ข้าว','ปลาส้ม','ผักสด','หน่อไม้ดอง'][i]} · ภาพ AI ตัวอย่าง</option>`).join('')}</select><small>ยังไม่เปิดอัปโหลดรูปส่วนตัว</small></label>`:''}<label class="form-field">ชื่อร้านหรือชื่อที่ใช้แสดง *<input class="field" name="seller" required minlength="2" maxlength="50" value="${esc(x?.seller)}" placeholder="ใช้ชื่อร้านหรือชื่อเล่น"></label><label class="form-field">รายละเอียด *<textarea class="field" name="description" required minlength="5" maxlength="1000" placeholder="รายละเอียดสินค้า บริการ และพื้นที่นัดรับ โดยไม่ระบุที่อยู่ส่วนตัว">${esc(x?.description)}</textarea></label><div class="form-grid"><label class="form-field">เบอร์โทร (ไม่บังคับ)<input class="field" name="phone" type="tel" inputmode="tel" maxlength="10" pattern="0[0-9]{8,9}" value="${esc(x?.phone)}" placeholder="กรอกเฉพาะเบอร์ของคุณ"><small>รอยืนยัน ไม่แสดงปุ่มโทร</small></label><label class="form-field">LINE ID (ไม่บังคับ)<input class="field" name="line" maxlength="40" pattern="[A-Za-z0-9_.-]{4,40}" value="${esc(x?.line)}" placeholder="กรอกเฉพาะบัญชีของคุณ"><small>รอยืนยัน ไม่แสดงลิงก์ LINE</small></label></div>`,`data-id="${esc(id)}"`));}
  function helpForm(){modal('แจ้งเรื่องขอความช่วยเหลือ',`<div class="notice" style="margin-bottom:16px">แอปไม่ได้ติดต่อหน่วยฉุกเฉิน ไม่มีเจ้าหน้าที่รับเรื่อง ข้อมูลอยู่เฉพาะเครื่อง หากอันตรายต่อชีวิต <a href="tel:1669" style="text-decoration:underline">โทร 1669</a></div>`+formShell('help',`<label class="form-field">เรื่องที่ต้องการความช่วยเหลือ *<input class="field" name="title" required minlength="5" maxlength="90" placeholder="เช่น ขอแรงช่วยขนของในชุมชน"></label><label class="form-field">ตำบล *<select class="field" name="area" required>${areaOptions('',false)}</select></label><label class="form-field">รายละเอียด *<textarea class="field" name="description" required minlength="10" maxlength="1000" placeholder="อธิบายความช่วยเหลือที่ต้องการ ไม่ใส่ชื่อผู้ป่วยหรือข้อมูลส่วนตัว"></textarea></label>`));}
  function detail(id,isService=false){const x=(isService?services():products()).find(v=>v.id===id);if(!x)return toast('ไม่พบประกาศ');const reviews=db.reviews.filter(r=>r.target===id);modal(x.title,`<img class="detail-image" src="./assets/${imageFiles.includes(x.image)?x.image:'tools.webp'}" alt="ภาพประกอบสร้างด้วย AI"><span class="pill amber">${x.sample?'ข้อมูลตัวอย่าง ไม่ใช่ผู้ขายจริง':'ประกาศในเครื่อง ยังไม่เผยแพร่'}</span>${!isService?`<div class="price" style="margin-top:15px">฿${Number(x.price).toLocaleString('th-TH')}<small>/ ${esc(x.unit)}</small></div>`:''}<div class="meta">${icon('pin')} พื้นที่${isService?'ให้บริการ':''} ต.${esc(x.area)}</div><p class="detail-desc">${esc(x.description)}</p><p class="intro-small">${esc(x.seller)} · ยังไม่ผ่านการยืนยันตัวตน</p><div class="notice" style="margin-top:15px">รอยืนยันช่องทางติดต่อ · ยังไม่มีปุ่มโทรหรือ LINE สำหรับประกาศนี้ ไม่โอนเงินก่อนตรวจสอบผู้ขาย</div><div class="detail-actions">${owned(x)?`<button class="btn secondary" data-action="edit-${isService?'service':'product'}" data-id="${esc(id)}">${icon('edit')} แก้ไขประกาศ</button>`:''}<button class="btn secondary" data-action="report" data-id="${esc(id)}">${icon('flag')} รายงาน (ทดลอง)</button></div>${isService?`<section class="section"><h3>รีวิวบริการ</h3><p class="intro-small">ยังไม่มีรีวิวจากลูกค้าจริง บันทึกด้านล่างเป็นรีวิวทดลองในเครื่อง ไม่นับเป็นคะแนนผู้ให้บริการ</p>${reviews.map(r=>`<div class="review-item"><span class="pill">รีวิวทดลอง ${r.rating}/5</span><p style="margin-top:7px">${esc(r.text)}</p></div>`).join('')}<button class="text-link" data-action="review" data-id="${esc(id)}">${icon('star')} เขียนรีวิวทดลอง</button></section>`:''}`);}
  function account(){modal('บัญชีทดลองและประกาศของฉัน',`<p>ขณะนี้ยังไม่มีการเข้าสู่ระบบจริง สิทธิ์แก้ไขผูกกับข้อมูลเดโมในเบราว์เซอร์นี้ ไม่ใช่ระบบยืนยันตัวตนที่ปลอดภัยสำหรับใช้งานร่วมกัน</p><button class="btn soft full" data-action="line-login">${icon('chat')} เข้าสู่ระบบผ่าน LINE</button><p class="intro-small" id="line-state">${window.SATUEK_CONFIG?.liffId?'เตรียมเชื่อมต่อ LIFF ที่เจ้าของกำหนด':'ยังไม่ได้ตั้งค่า LIFF ID สำหรับ Satuek Connect'}</p><section class="section"><h3>ประกาศที่คุณบันทึกในเครื่อง</h3>${[...db.products,...db.services].filter(owned).map(x=>`<div class="review-item"><strong>${esc(x.title)}</strong><br><button class="text-link" data-action="edit-${db.products.includes(x)?'product':'service'}" data-id="${esc(x.id)}">แก้ไขประกาศ</button></div>`).join('')||'<p class="intro-small">ยังไม่มีประกาศของคุณ ลองลงสินค้าได้ที่หน้าตลาด</p>'}</section>`);}
  function reportForm(id){modal('รายงานประกาศ (ทดลอง)',`<p>รายงานนี้เก็บในเครื่องเท่านั้น ยังไม่ส่งให้ผู้ดูแล ไม่ใช้สำหรับแจ้งเหตุฉุกเฉิน</p>`+formShell('report',`<label class="form-field">เหตุผล *<select class="field" name="reason" required>${selectOptions(['ข้อมูลไม่ถูกต้อง','ประกาศสแปม','เนื้อหาไม่เหมาะสม','สงสัยการหลอกลวง'],'','เลือกเหตุผล')}</select></label><label class="form-field">รายละเอียด *<textarea class="field" name="description" required minlength="5" maxlength="500"></textarea></label>`,`data-target="${esc(id)}"`));}
  function reviewForm(id){modal('เขียนรีวิวทดลอง',`<p>ไม่ใช่รีวิวจากลูกค้าจริง คะแนนนี้เก็บเฉพาะเครื่อง และจะไม่แสดงเป็นคะแนนบริการที่ผ่านการตรวจสอบ</p>`+formShell('review',`<label class="form-field">คะแนนทดลอง<select class="field" name="rating" required>${[5,4,3,2,1].map(x=>`<option value="${x}">${x} / 5</option>`).join('')}</select></label><label class="form-field">ข้อความรีวิวทดลอง *<textarea class="field" name="text" required minlength="5" maxlength="500"></textarea></label>`,`data-target="${esc(id)}"`));}
  function planForm(id){const plan=PLANS.find(x=>x[0]===id);if(!plan)return;if(id==='free'){modalClose();go('market');setTimeout(()=>listingForm('product'),50);return;}modal('สมัครใช้บริการ (ทดลอง)',`<h3>${esc(plan[1])} · ฿${plan[2]} / ${esc(plan[3])}</h3><p style="margin-top:10px">บันทึกความสนใจไว้ในเครื่องเท่านั้น ไม่ส่งคำขอให้ทีมงาน ไม่มีการรับเงินหรือเปิดสิทธิ์ปักหมุด</p>`+formShell('interest',`<label class="form-field">ชื่อร้านหรือบริการ *<input class="field" name="shop" required minlength="2" maxlength="60"></label>`,`data-target="${esc(id)}"`));}
  function modalClose(){$('#modal').close();}
  const textValue=(d,k,min,max)=>{const v=String(d.get(k)||'').trim();if(v.length<min||v.length>max)throw Error('กรุณากรอกข้อมูลให้ครบและไม่เกินจำนวนตัวอักษรที่กำหนด');return v;};
  function submitEntry(form){if(!form.reportValidity())return;const data=new FormData(form),kind=form.dataset.kind;const error=$('#form-error');try{if(data.get('website'))throw Error('ไม่สามารถบันทึกข้อมูลนี้ได้');if(!data.has('consent'))throw Error('กรุณายืนยันเงื่อนไขการทดลอง');if(Date.now()-formOpened<1500)throw Error('กรุณาตรวจสอบข้อมูลสักครู่แล้วกดบันทึกอีกครั้ง');const next=structuredClone(db),now=Date.now(),limitKey=kind==='product'||kind==='service'?'listing':kind;const recent=(next.limits[limitKey]||[]).filter(t=>now-t<600000);if(recent.length>=5)throw Error('บันทึกได้ไม่เกิน 5 ครั้งใน 10 นาที กรุณารอก่อนลองใหม่');if(recent.length&&now-recent.at(-1)<10000)throw Error('กรุณารอ 10 วินาทีก่อนบันทึกรายการถัดไป');const base={id:crypto.randomUUID(),owner:db.owner,createdAt:new Date().toISOString()};let title='';
  if(kind==='product'||kind==='service'){const isProduct=kind==='product',list=isProduct?next.products:next.services,existing=form.dataset.id?list.find(x=>x.id===form.dataset.id&&owned(x)):null;if(form.dataset.id&&!existing)throw Error('ไม่มีสิทธิ์แก้ไขประกาศนี้');title=textValue(data,'title',3,90);const areaVal=data.get('area'),cat=data.get('category');if(!AREAS.includes(areaVal)||!(isProduct?PRODUCT_TYPES:SERVICE_TYPES).includes(cat))throw Error('กรุณาเลือกพื้นที่และหมวดหมู่ที่ถูกต้อง');const phone=String(data.get('phone')||'').trim(),line=String(data.get('line')||'').trim();if(phone&&!/^0[0-9]{8,9}$/.test(phone))throw Error('รูปแบบเบอร์โทรไม่ถูกต้อง');if(line&&!/^[A-Za-z0-9_.-]{4,40}$/.test(line))throw Error('รูปแบบ LINE ID ไม่ถูกต้อง');const price=isProduct?Number(data.get('price')):null;if(isProduct&&(!String(data.get('price')).trim()||!Number.isFinite(price)||price<0||price>10000000))throw Error('กรุณาระบุราคาที่ถูกต้อง');if(!existing&&list.some(x=>x.title===title&&x.area===areaVal))throw Error('มีประกาศนี้ในเครื่องแล้ว กรุณาแก้ไขประกาศเดิม');const x={...(existing||base),title,area:areaVal,category:cat,seller:textValue(data,'seller',2,50),description:textValue(data,'description',5,1000),phone,line,image:isProduct?data.get('image'):'tools.webp',contactVerified:false,verified:false,sample:false,...(isProduct?{price,unit:textValue(data,'unit',1,20)}:{})};if(!imageFiles.includes(x.image))throw Error('กรุณาเลือกภาพประกอบ');if(existing)list[list.indexOf(existing)]=x;else list.unshift(x);
  }else if(kind==='help'){title=textValue(data,'title',5,90);const a=data.get('area');if(!AREAS.includes(a))throw Error('กรุณาเลือกตำบล');if(next.help.some(x=>x.title===title&&x.area===a))throw Error('มีเรื่องนี้ในเครื่องแล้ว');next.help.unshift({...base,title,area:a,description:textValue(data,'description',10,1000),status:STATUSES[0]});
  }else if(kind==='review'){if(!services().some(x=>x.id===form.dataset.target))throw Error('ไม่พบบริการ');if(next.reviews.some(x=>x.target===form.dataset.target&&x.owner===db.owner))throw Error('คุณมีรีวิวทดลองสำหรับบริการนี้แล้ว');const rating=Number(data.get('rating'));if(!Number.isInteger(rating)||rating<1||rating>5)throw Error('คะแนนไม่ถูกต้อง');next.reviews.push({...base,target:form.dataset.target,rating,text:textValue(data,'text',5,500),demo:true});
  }else if(kind==='report'){const reason=data.get('reason');if(!['ข้อมูลไม่ถูกต้อง','ประกาศสแปม','เนื้อหาไม่เหมาะสม','สงสัยการหลอกลวง'].includes(reason))throw Error('กรุณาเลือกเหตุผล');if(next.reports.some(x=>x.target===form.dataset.target&&x.owner===db.owner))throw Error('คุณรายงานรายการนี้ในเครื่องแล้ว');next.reports.push({...base,target:form.dataset.target,reason,description:textValue(data,'description',5,500)});
  }else if(kind==='interest'){if(next.interests.some(x=>x.target===form.dataset.target))throw Error('บันทึกความสนใจแพ็กเกจนี้แล้ว');next.interests.push({...base,target:form.dataset.target,shop:textValue(data,'shop',2,60)});
  }else throw Error('ไม่รู้จักแบบฟอร์ม');next.limits[limitKey]=[...recent,now];persist(next);modalClose();if(kind==='product'||kind==='service'){query='';area='';category='';savedOnly=false;go(kind==='product'?'market':'services');}else render();toast(kind==='help'?'บันทึกในเครื่องแล้ว ยังไม่มีการแจ้งหน่วยฉุกเฉิน':'บันทึกในเครื่องแล้ว ยังไม่มีการส่งข้อมูลให้ผู้อื่น');
  }catch(e){error.textContent=e.message||'บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง';error.hidden=false;error.scrollIntoView({block:'nearest'});}}
  let liffPromise;
  async function lineLogin(){const state=$('#line-state');if(!window.SATUEK_CONFIG?.liffId){state.textContent='ยังเข้าสู่ระบบ LINE ไม่ได้: เจ้าของต้องกำหนด LIFF ID และ Endpoint URL สำหรับ Satuek Connect ก่อน';return;}try{state.textContent='กำลังเชื่อมต่อ LINE…';if(!liffPromise)liffPromise=new Promise((resolve,reject)=>{if(window.liff)return resolve();const s=document.createElement('script');s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';s.onload=resolve;s.onerror=()=>reject(Error('โหลด LINE SDK ไม่สำเร็จ'));document.head.append(s);});await liffPromise;await window.liff.init({liffId:window.SATUEK_CONFIG.liffId});if(!window.liff.isLoggedIn()){window.liff.login({redirectUri:location.href.split('#')[0]});return;}state.textContent=(window.liff.isInClient()?'เปิดผ่าน LINE แล้ว':'เปิดจากเบราว์เซอร์และเข้าสู่ LINE แล้ว')+' · ยังไม่เชื่อมบัญชีชุมชนกับเซิร์ฟเวอร์ การยืนยัน LINE ฝั่งเซิร์ฟเวอร์ยังไม่เปิดใช้งาน';}catch(e){liffPromise=null;if(state)state.textContent='เชื่อมต่อ LINE ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่าและลองใหม่';}}
  document.addEventListener('submit',e=>{if(e.target.id==='home-search'){e.preventDefault();const q=new FormData(e.target).get('q').trim();if(!q)return;go('search',{query:q});}if(e.target.id==='entry-form'){e.preventDefault();submitEntry(e.target);}});
  document.addEventListener('input',e=>{if(e.target.id==='list-query'){query=e.target.value;results();}});
  document.addEventListener('change',e=>{if(e.target.id==='area-filter'){area=e.target.value;results();}if(e.target.id==='category-filter'){category=e.target.value;results();}if(e.target.dataset.helpId){const x=db.help.find(x=>x.id===e.target.dataset.helpId&&owned(x));if(!x||!STATUSES.includes(e.target.value))return;try{const next=structuredClone(db);next.help.find(v=>v.id===x.id).status=e.target.value;persist(next);helpResults();toast('อัปเดตสถานะทดลองในเครื่องแล้ว');}catch(err){e.target.value=x.status;toast(err.message);}}});
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn){const link=e.target.closest('a[href^="#"]');if(link&&['home','market','services','help','plans'].includes(link.hash.slice(1))){e.preventDefault();go(link.hash.slice(1));}return;}e.preventDefault();const a=btn.dataset.action,id=btn.dataset.id;try{
  if(a==='close')modalClose();else if(a==='account')account();else if(a==='add-product')listingForm('product');else if(a==='add-service')listingForm('service');else if(a==='add-help')helpForm();else if(a==='detail')detail(id);else if(a==='detail-service')detail(id,true);else if(a==='edit-product')listingForm('product',id);else if(a==='edit-service')listingForm('service',id);else if(a==='report')reportForm(id);else if(a==='review')reviewForm(id);else if(a==='plan')planForm(id);else if(a==='line-login')lineLogin();else if(a==='save'){const next=structuredClone(db);next.saved=next.saved.includes(id)?next.saved.filter(v=>v!==id):[...next.saved,id];persist(next);if(route==='market')results();else render();toast(next.saved.includes(id)?'บันทึกรายการโปรดในเครื่องแล้ว':'นำออกจากรายการที่บันทึกแล้ว');}else if(a==='reset'){query='';area='';category='';savedOnly=false;render();}else if(a==='show-all'||a==='show-saved'){savedOnly=a==='show-saved';render();}else if(a==='service-filter'){category=category===btn.dataset.value?'':btn.dataset.value;render();}else if(a==='help-filter'){helpStatus=btn.dataset.value;render();}else if(a==='shortcut'){const target=btn.dataset.target;if(target==='news'){document.querySelector('#community')?.scrollIntoView();return;}const map={food:['market','อาหารและของกิน'],vegetables:['market','ผักและผลไม้'],rice:['market','เกษตรและข้าว'],secondhand:['market','ของใช้และมือสอง'],services:['services',''],transport:['services','รถรับจ้าง'],help:['help','']};go(map[target][0],{category:map[target][1]});}else if(a==='privacy'){modal('ความเป็นส่วนตัว',`<p>เดโมนี้เก็บประกาศ รีวิวทดลอง รายงาน และความสนใจแพ็กเกจไว้ใน localStorage ของเบราว์เซอร์เครื่องนี้เท่านั้น ไม่มีการซิงก์หรือส่งข้อมูลเหล่านี้ไปเซิร์ฟเวอร์</p><p>หลีกเลี่ยงข้อมูลส่วนตัวของผู้อื่น เช่น เบอร์โทร ที่อยู่ละเอียด ข้อมูลสุขภาพ และภาพบุคคล ใช้ชื่อร้านหรือชื่อเล่น ข้อมูลติดต่อที่กรอกยังไม่แสดงปุ่มโทรหรือ LINE จนกว่าจะยืนยันจริง</p><p>ภาพและฟอนต์ให้บริการจากเว็บนี้ เมื่อคุณเลือกเข้าสู่ระบบ LINE หลังตั้งค่าแล้ว จะติดต่อบริการ LINE ตามนโยบายของ LINE ไม่มีระบบติดตามโฆษณาหรือชำระเงินในเดโม</p><button class="btn secondary" data-action="reset-storage">ล้างข้อมูลเดโมในเครื่องนี้</button>`);}else if(a==='about'){modal('เกี่ยวกับรุ่นทดลอง',`<p>สตึกคอนเนคเป็นพื้นที่ทดลองสำหรับคนอำเภอสตึก จังหวัดบุรีรัมย์ ครอบคลุมทั้ง 12 ตำบล</p><p>สิ่งที่ทดลองได้: ค้นหา กรอง ลงและแก้ไขประกาศ บันทึกรายการโปรด รีวิวทดลอง และติดตามสถานะเรื่องในเครื่อง</p><p>ยังไม่เปิด: เผยแพร่ข้ามเครื่อง บัญชีจริง ยืนยันตัวตน ยืนยันช่องทางติดต่อ ทีมรับแจ้งเหตุ รีวิวลูกค้าจริง และรับชำระเงิน ภาพประกอบสร้างด้วย Adobe Firefly ไม่ใช่ภาพสินค้าหรือผู้ให้บริการจริง</p><p>อย่าพึ่งพาแอปสำหรับเหตุฉุกเฉิน โทร 1669 โดยตรงเมื่อมีอันตรายต่อชีวิต</p>`);}else if(a==='retry-storage'){storageIssue='';load();render();}else if(a==='reset-storage'){modal('ล้างข้อมูลเดโมในเครื่องนี้?',`<p>ประกาศ รายการที่บันทึก รีวิว รายงาน และเรื่องขอความช่วยเหลือทดลองจะถูกล้างเฉพาะ Satuek Connect ในเบราว์เซอร์นี้ กู้คืนไม่ได้</p><div class="form-actions"><button class="btn secondary" data-action="close">เก็บข้อมูลไว้</button><button class="btn danger" data-action="confirm-reset">ยืนยันล้างข้อมูลเดโม</button></div>`);}else if(a==='confirm-reset'){try{localStorage.removeItem(KEY);storageIssue='';load();modalClose();render();toast(storageIssue?'ยังไม่สามารถใช้พื้นที่จัดเก็บได้':'ล้างข้อมูลเดโมแล้ว');}catch{toast('ล้างข้อมูลไม่สำเร็จ เบราว์เซอร์ไม่อนุญาตให้ใช้พื้นที่จัดเก็บ');}}}catch(err){toast(err.message||'เกิดข้อผิดพลาด กรุณาลองอีกครั้ง');}});
  $('#modal').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();else $('#main').focus({preventScroll:true});});
  window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'home';if(!['home','market','services','help','plans','search'].includes(route)){route='home';history.replaceState(null,'','#home');}render();window.scrollTo(0,0);});
  window.addEventListener('storage',e=>{if(e.key!==KEY)return;storageIssue='';load();if($('#modal').open)modalClose();render();toast('อัปเดตข้อมูลจากแท็บอื่นแล้ว');});
  load();route=location.hash.slice(1)||'home';if(!['home','market','services','help','plans','search'].includes(route))route='home';document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon));render();
  </script>
