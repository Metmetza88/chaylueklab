<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CHAILUEKLAB AI</title>
  <style>
    :root{
      --bg:#08090a;--bg2:#101214;--card:#f1e6cf;--card2:#eadbbd;--ink:#151515;
      --gold:#d4af37;--gold2:#f3d27a;--green:#19c56b;--red:#991b1b;--muted:#8f938f;
      --line:#24282a;--white:#f7f7f2;--shadow:0 14px 35px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:linear-gradient(180deg,#060708,#0a0b0c 40%,#050606);color:var(--white);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;min-height:100%}
    body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:560px;margin:0 auto;min-height:100vh;background:
      radial-gradient(circle at 50% -20%,rgba(212,175,55,.12),transparent 35%),
      radial-gradient(circle at 100% 20%,rgba(25,197,107,.05),transparent 25%)}
    .top{position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
      background:rgba(8,9,10,.9);backdrop-filter:blur(16px);border-bottom:1px solid #1d2022}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brandmark{display:flex;align-items:center;gap:12px}
    .sigil{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
      background:linear-gradient(145deg,#16110a,#050505);box-shadow:0 0 0 3px rgba(212,175,55,.08)}
    .sigil:before{content:"◢";color:var(--gold2);font-size:22px;transform:rotate(-45deg)}
    .brand h1{font-size:21px;margin:0;color:var(--gold2);letter-spacing:.3px}
    .brand small{display:block;color:#a9aaa8;font-size:11px;letter-spacing:1.2px;margin-top:2px}
    .statusdot{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#b7bbb7}
    .statusdot i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(25,197,107,.8)}
    .page{padding:16px;display:none}
    .page.active{display:block}
    .hero{background:linear-gradient(140deg,#15100b,#0f1010 65%,#171308);border:1px solid #3b3320;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
    .hero .hello{font-size:13px;color:#bebbb1}.hero h2{font-size:25px;margin:6px 0 4px;color:#fff}
    .hero p{margin:0;color:#c9c8c1;font-size:14px}.quote{margin-top:14px;color:#e1b08f;font-size:14px}
    .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 18px}
    .stat{background:#111416;border:1px solid #262a2d;border-radius:16px;padding:14px;min-height:96px}
    .stat b{font-size:24px;display:block;margin-top:8px}.stat span{color:#9ea29f;font-size:12px}.stat .ico{font-size:20px}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
    .section-title h3{margin:0;font-size:19px}.section-title button{background:none;border:0;color:var(--gold2);font-size:13px}
    .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .quick button{background:var(--card);border:0;border-radius:15px;padding:13px 6px;color:var(--ink);min-height:92px;box-shadow:var(--shadow)}
    .quick .qico{font-size:24px;display:block;margin-bottom:8px}.quick small{font-size:11px}
    .paper{background:linear-gradient(180deg,#f3e8d1,#ead9b8);color:var(--ink);border-radius:18px;padding:14px;border:1px solid #cdbf9d;box-shadow:var(--shadow)}
    .list{display:flex;flex-direction:column;gap:10px}
    .row{display:flex;gap:12px;align-items:center}.row .grow{flex:1}
    .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#131313;border:1px solid var(--gold);color:var(--gold2);font-weight:800}
    .paper h4{margin:0 0 4px;font-size:16px}.paper p{margin:0;color:#5e584d;font-size:12px}
    .tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;background:#e4d7ba;color:#423c31;margin-top:7px}
    .tag.green{background:#cfeeda;color:#0d6a35}.tag.red{background:#f0d0cc;color:#8d1d12}.tag.gold{background:#efe0aa;color:#725700}
    .btn{border:0;border-radius:13px;padding:11px 14px;background:#23272a;color:#fff}.btn.gold{background:linear-gradient(180deg,#e5c45f,#b68d22);color:#1a1408;font-weight:700}
    .btn.green{background:#0d6e3a}.btn.red{background:#7f1d1d}.btn.ghost{background:transparent;border:1px solid #3a3f42}
    .fab{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
      border:0;background:linear-gradient(180deg,#e3bd4f,#b38b20);font-size:28px;z-index:35;box-shadow:0 12px 35px rgba(0,0,0,.45)}
    .tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid #2c3032;background:#111315;color:#bfc1c0;padding:9px 13px;border-radius:999px}
    .tabs button.active{background:#17321f;color:#dff7e8;border-color:#235e37}
    .task{display:flex;gap:10px;align-items:flex-start}.check{width:25px;height:25px;border-radius:7px;border:2px solid #504a3e;background:transparent;display:grid;place-items:center;flex:0 0 auto}
    .check.done{background:#1ca65d;color:white;border-color:#1ca65d}.task.done h4{text-decoration:line-through;opacity:.6}
    .progress{height:8px;background:#272b2c;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#13b863,#6ae39c)}
    .muted{color:#8c918e}.moneyplus{color:#5be696}.moneyminus{color:#ff7368}
    .ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ai-grid button{min-height:100px;background:linear-gradient(180deg,#efe2c7,#e5d3b2);color:#151515;border:0;border-radius:17px;padding:12px}
    .ai-grid .ico{font-size:26px;display:block;margin-bottom:8px}
    .composer{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));margin-top:14px;background:#101315;border:1px solid #2e3335;border-radius:18px;padding:8px;display:flex;gap:8px}
    .composer input{flex:1;background:transparent;border:0;color:#fff;padding:10px;outline:0}.composer button{width:44px;border-radius:12px;border:0;background:#167443;color:white}
    .chat{display:flex;flex-direction:column;gap:9px;margin-top:14px}.bubble{max-width:86%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.45}
    .bubble.user{align-self:flex-end;background:#245b39}.bubble.bot{align-self:flex-start;background:#1a1d1f;border:1px solid #2b3032}
    .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(100%,560px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      background:rgba(7,8,8,.96);border-top:1px solid #1f2325;display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(18px)}
    .bottom button{border:0;background:transparent;color:#8f9491;padding:7px 2px;font-size:11px}.bottom .ico{display:block;font-size:21px;margin-bottom:3px}
    .bottom button.active{color:var(--gold2)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;display:none;align-items:flex-end;justify-content:center}
    .modal.show{display:flex}.sheet{width:min(100%,560px);max-height:90vh;overflow:auto;background:#111315;border-radius:24px 24px 0 0;padding:18px;border:1px solid #292e30}
    .sheet h3{margin:2px 0 14px}.form{display:grid;gap:11px}.form label{font-size:12px;color:#aeb2af}.form input,.form select,.form textarea{
      width:100%;background:#0a0c0d;border:1px solid #2f3437;border-radius:12px;padding:12px;color:#fff;margin-top:5px;outline:0}
    .form textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#202426;color:white;padding:10px 14px;border-radius:12px;z-index:200;display:none;box-shadow:var(--shadow)}
    .toast.show{display:block}
    .setting{background:#111416;border:1px solid #282d2f;border-radius:16px;padding:14px;margin-bottom:10px}
    .setting h4{margin:0 0 5px}.setting p{margin:0;color:#969c98;font-size:12px}
    .inline{display:flex;gap:8px;align-items:center}.inline>*{flex:1}
    .danger{border-color:#4b2020;background:#1a0f0f}
    .empty{text-align:center;padding:26px 10px;color:#8d918f}
    .mini{font-size:11px}.right{text-align:right}
    @media(min-width:760px){
      .app{border-left:1px solid #161a1c;border-right:1px solid #161a1c}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brandmark">
        <div class="sigil"></div>
        <div><h1>ชายลึกลับ</h1><small>CHAILUEKLAB · AI ผู้ช่วยของคุณ</small></div>
      </div>
      <div class="statusdot"><i></i><span>ONLINE</span></div>
    </div>
  </header>

  <main>
    <section id="home" class="page active"></section>
    <section id="groups" class="page"></section>
    <section id="tasks" class="page"></section>
    <section id="ai" class="page"></section>
    <section id="account" class="page"></section>
    <section id="finance" class="page"></section>
    <section id="membership" class="page"></section>
  </main>

  <button id="fab" class="fab" title="เพิ่ม">＋</button>

  <nav class="bottom">
    <button data-tab="home" class="active"><span class="ico">⌂</span>หน้าหลัก</button>
    <button data-tab="groups"><span class="ico">♟</span>กลุ่ม</button>
    <button data-tab="tasks"><span class="ico">▣</span>งาน</button>
    <button data-tab="ai"><span class="ico">✦</span>AI</button>
    <button data-tab="account"><span class="ico">◉</span>บัญชี</button>
  </nav>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
const APP_CONFIG={
  liffId: new URLSearchParams(location.search).get('liffId') || '',
  lineReady:false
};
async function initLineBridge(){
  if(!APP_CONFIG.liffId) return;
  try{
    if(!window.liff){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';
        s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
      });
    }
    await window.liff.init({liffId:APP_CONFIG.liffId});
    APP_CONFIG.lineReady=true;
    if(window.liff.isLoggedIn()){
      const p=await window.liff.getProfile();
      if(p?.displayName && db?.profile && db.profile.name==='คุณชายลึกลับ'){
        db.profile.name=p.displayName; save();
      }
    }
  }catch(e){ console.warn('LIFF init skipped:', e); }
}
const KEY='chailueklab_app_v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const fmtBaht=n=>new Intl.NumberFormat('th-TH').format(Number(n||0))+' บาท';

const seed={
  profile:{name:'คุณชายลึกลับ',notifications:true,defaultGroup:'g1',webhookUrl:'',plan:'AI PRO',trialEnds:'2026-10-21'},
  groups:[
    {id:'g1',name:'Chailueklab Official',members:128,role:'Owner'},
    {id:'g2',name:'ร้าน พ.สมนึก 2',members:25,role:'Admin'},
    {id:'g3',name:'ทีมงานสตึก',members:18,role:'Owner'},
    {id:'g4',name:'ครอบครัว',members:6,role:'Member'}
  ],
  tasks:[
    {id:uid(),title:'โพสต์โปรโมตสินค้า',date:today(),time:'12:00',category:'การตลาด',groupId:'g1',priority:'กลาง',notes:'โพสต์ Facebook / LINE',done:false},
    {id:uid(),title:'เช็กออเดอร์',date:today(),time:'10:00',category:'งานขาย',groupId:'g1',priority:'สูง',notes:'',done:true},
    {id:uid(),title:'เตรียมของส่งลูกค้า',date:today(),time:'14:00',category:'ส่งสินค้า',groupId:'g2',priority:'สูง',notes:'',done:false},
    {id:uid(),title:'สรุปยอดรายวัน',date:today(),time:'20:00',category:'สรุปงาน',groupId:'g1',priority:'กลาง',notes:'',done:false}
  ],
  transactions:[
    {id:uid(),type:'income',amount:150,note:'ลูกค้า LINE',date:today(),category:'ขายสินค้า',groupId:'g1'},
    {id:uid(),type:'income',amount:300,note:'ลูกค้า TikTok',date:today(),category:'ขายสินค้า',groupId:'g1'},
    {id:uid(),type:'expense',amount:70,note:'ค่ากล่อง/อุปกรณ์',date:today(),category:'ต้นทุน',groupId:'g1'}
  ],
  aiHistory:[
    {role:'bot',text:'สวัสดีครับ ผมพร้อมช่วยคิดงาน วางแผน สรุปข้อมูล ตั้งเตือน และร่างคอนเทนต์ให้ครับ'}
  ]
};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=load();
initLineBridge().then(()=>render());
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function groupName(id){return db.groups.find(g=>g.id===id)?.name||'ไม่ระบุกลุ่ม'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function showModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

let current='home', taskFilter='all';
function setTab(tab,push=true){
  const valid=['home','groups','tasks','ai','account','finance','membership'];
  if(!valid.includes(tab))tab='home';
  current=tab;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('fab').style.display=['groups','tasks','finance'].includes(tab)?'block':'none';
  if(push){
    const u=new URL(location.href);u.searchParams.set('tab',tab);history.replaceState({},'',u);
  }
  render();
}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById('fab').onclick=()=> {
  if(current==='groups')groupForm();
  if(current==='tasks')taskForm();
  if(current==='finance')transactionForm();
};

function render(){renderHome();renderGroups();renderTasks();renderAI();renderAccount();renderFinance();renderMembership()}

function renderHome(){
  const open=db.tasks.filter(t=>!t.done).length, done=db.tasks.filter(t=>t.done).length;
  const income=db.transactions.filter(x=>x.type==='income'&&x.date===today()).reduce((a,b)=>a+Number(b.amount),0);
  document.getElementById('home').innerHTML=`
    <div class="hero">
      <div class="hello">สวัสดีครับ</div><h2>${esc(db.profile.name)}</h2>
      <p>วันนี้ให้ผมช่วยอะไรดี?</p><div class="quote">“ไอเดียดี ๆ เริ่มได้จากการลงมือทำ”</div>
    </div>
    <div class="grid4">
      <div class="stat"><span class="ico">☑</span><b>${open}</b><span>งานที่ต้องทำ</span></div>
      <div class="stat"><span class="ico">◌</span><b>${db.aiHistory.length}</b><span>ข้อความ AI</span></div>
      <div class="stat"><span class="ico">♟</span><b>${db.groups.length}</b><span>กลุ่มของฉัน</span></div>
      <div class="stat"><span class="ico">฿</span><b>${new Intl.NumberFormat('th-TH').format(income)}</b><span>รายรับวันนี้</span></div>
    </div>
    <div class="section-title"><h3>เมนูลัด</h3></div>
    <div class="quick">
      <button onclick="setTab('ai')"><span class="qico">✦</span><b>คุยกับ AI</b><br><small>ถาม/ปรึกษา</small></button>
      <button onclick="taskForm()"><span class="qico">▣</span><b>สร้างงาน</b><br><small>เพิ่ม/สรุป</small></button>
      <button onclick="aiShortcut('สร้างภาพ')"><span class="qico">▧</span><b>สร้างภาพ</b><br><small>AI สร้างภาพ</small></button>
      <button onclick="taskForm(null,true)"><span class="qico">◷</span><b>ตั้งเตือน</b><br><small>ไม่พลาดงาน</small></button>
    </div>
    <div class="section-title"><h3>งานวันนี้</h3><button onclick="setTab('tasks')">ดูทั้งหมด →</button></div>
    <div class="list">${db.tasks.filter(t=>t.date===today()).slice(0,4).map(taskCard).join('')||'<div class="empty">วันนี้ยังไม่มีงาน</div>'}</div>
    <div class="section-title"><h3>ทางลัดอื่น ๆ</h3></div>
    <div class="list">
      <div class="paper row" onclick="setTab('finance')"><div class="avatar">฿</div><div class="grow"><h4>การเงิน</h4><p>บันทึกรายรับ รายจ่าย และดูสรุป</p></div><b>›</b></div>
      <div class="paper row" onclick="setTab('membership')"><div class="avatar">♛</div><div class="grow"><h4>สมาชิก / ราคา</h4><p>${esc(db.profile.plan)} · ทดลองใช้งาน</p></div><b>›</b></div>
    </div>`;
}

function renderGroups(){
  document.getElementById('groups').innerHTML=`
    <div class="section-title"><h3>กลุ่มของฉัน</h3><button onclick="groupForm()">＋ สร้างกลุ่ม</button></div>
    <div class="list">${db.groups.map(g=>{
      const ts=db.tasks.filter(t=>t.groupId===g.id), pct=ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0;
      return `<div class="paper">
        <div class="row"><div class="avatar">◢</div><div class="grow" onclick="groupDetail('${g.id}')"><h4>${esc(g.name)}</h4>
        <p>สมาชิก ${g.members} คน · ${esc(g.role)}</p><span class="tag green">● AI ออนไลน์</span></div>
        <button class="btn" onclick="groupMenu('${g.id}')">•••</button></div>
        <div style="margin-top:12px"><div class="mini">${ts.filter(t=>t.done).length} จาก ${ts.length} งานเสร็จแล้ว · ${pct}%</div>
        <div class="progress" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
      </div>`
    }).join('')||'<div class="empty">ยังไม่มีกลุ่ม</div>'}</div>`;
}
function groupDetail(id){
  const g=db.groups.find(x=>x.id===id);if(!g)return;
  const ts=db.tasks.filter(t=>t.groupId===id);
  showModal(`<h3>${esc(g.name)}</h3><div class="paper"><h4>ข้อมูลกลุ่ม</h4><p>สมาชิก ${g.members} คน · สิทธิ์ ${esc(g.role)}</p><span class="tag green">AI ออนไลน์</span></div>
    <div class="section-title"><h3>งานในกลุ่ม</h3></div><div class="list">${ts.map(taskCard).join('')||'<div class="empty">ยังไม่มีงานในกลุ่มนี้</div>'}</div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">ปิด</button><button class="btn gold" onclick="closeModal();taskForm(null,false,'${id}')">＋ เพิ่มงาน</button></div>`);
}
function groupForm(id){
  const g=id?db.groups.find(x=>x.id===id):null;
  showModal(`<h3>${g?'แก้ไขกลุ่ม':'สร้างกลุ่มใหม่'}</h3><form class="form" onsubmit="saveGroup(event,'${g?.id||''}')">
    <label>ชื่อกลุ่ม<input name="name" required value="${esc(g?.name||'')}"></label>
    <label>จำนวนสมาชิก<input name="members" type="number" min="1" value="${g?.members||1}"></label>
    <label>สิทธิ์<select name="role">${['Owner','Admin','Member'].map(x=>`<option ${g?.role===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn gold">บันทึก</button></div>
  </form>`);
}
function saveGroup(e,id){e.preventDefault();const f=new FormData(e.target);
  if(id){Object.assign(db.groups.find(x=>x.id===id),{name:f.get('name'),members:Number(f.get('members')),role:f.get('role')})}
  else db.groups.push({id:uid(),name:f.get('name'),members:Number(f.get('members')),role:f.get('role')});
  save();closeModal();render();toast('บันทึกกลุ่มแล้ว');
}
function groupMenu(id){
  const g=db.groups.find(x=>x.id===id);
  showModal(`<h3>${esc(g.name)}</h3><div class="actions" style="justify-content:stretch;flex-direction:column">

function deleteGroup(id){
  const g=db.groups.find(x=>x.id===id);if(!confirm('ลบกลุ่ม "'+g.name+'" ? งานและรายการเงินจะยังคงอยู่แต่ไม่มีกลุ่ม'))return;
  db.groups=db.groups.filter(x=>x.id!==id);save();closeModal();render();toast('ลบกลุ่มแล้ว');
}

function taskCard(t){
  return `<div class="paper task ${t.done?'done':''}">
    <button class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button>
    <div class="grow" onclick="taskForm('${t.id}')"><h4>${esc(t.title)}</h4><p>${esc(t.date)} ${esc(t.time||'')} · ${esc(groupName(t.groupId))}</p>
    <span class="tag">${esc(t.category)}</span> ${t.priority==='สูง'?'<span class="tag red">สำคัญ</span>':''}</div>
    <button class="btn" onclick="taskMenu('${t.id}')">•••</button>
  </div>`;
}
function renderTasks(){
  let arr=[...db.tasks];
  const d=today();
  if(taskFilter==='today')arr=arr.filter(t=>t.date===d);
  if(taskFilter==='week'){const now=new Date(d), end=new Date(now);end.setDate(end.getDate()+7);arr=arr.filter(t=>new Date(t.date)>=now&&new Date(t.date)<=end)}
  if(taskFilter==='done')arr=arr.filter(t=>t.done);
  const pct=db.tasks.length?Math.round(db.tasks.filter(t=>t.done).length/db.tasks.length*100):0;
  document.getElementById('tasks').innerHTML=`
    <div class="section-title"><h3>งาน / การแจ้งเตือน</h3><button onclick="taskForm()">＋ เพิ่มงาน</button></div>
    <div class="tabs">${[['all','ทั้งหมด'],['today','วันนี้'],['week','สัปดาห์นี้'],['done','เสร็จแล้ว']].map(x=>`<button class="${taskFilter===x[0]?'active':''}" onclick="taskFilter='${x[0]}';renderTasks()">${x[1]}</button>`).join('')}</div>
    <div class="paper" style="margin-bottom:12px"><div class="row"><div class="grow"><h4>ความคืบหน้าทั้งหมด</h4><p>${db.tasks.filter(t=>t.done).length}/${db.tasks.length} (${pct}%)</p></div></div><div class="progress" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>
    <div class="list">${arr.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(taskCard).join('')||'<div class="empty">ไม่มีงานในหมวดนี้</div>'}</div>`;
}

function saveTask(e,id){e.preventDefault();const f=new FormData(e.target),obj={title:f.get('title'),date:f.get('date'),time:f.get('time'),category:f.get('category'),groupId:f.get('groupId'),priority:f.get('priority'),notes:f.get('notes')};

function toggleTask(id){const t=db.tasks.find(x=>x.id===id);t.done=!t.done;save();render();toast(t.done?'ทำงานเสร็จแล้ว':'เปิดงานอีกครั้ง')}

function renderAI(){
  document.getElementById('ai').innerHTML=`
    <div class="section-title"><h3>สั่งงาน AI</h3><button onclick="clearAI()">ล้างแชต</button></div>
    <div class="ai-grid">${Object.keys(prompts).map((k,i)=>`<button onclick="aiShortcut('${k}')"><span class="ico">${['💡','📝','▤','◎','▧','⌁','🔔','⌕','•••'][i]}</span><b>${k}</b></button>`).join('')}</div>
    <div class="chat">${db.aiHistory.map(x=>`<div class="bubble ${x.role==='user'?'user':'bot'}">${esc(x.text)}</div>`).join('')}</div>
    <div class="composer"><input id="aiInput" placeholder="พิมพ์คำสั่งได้เลย..." onkeydown="if(event.key==='Enter')sendAI()"><button onclick="sendAI()">➤</button></div>`;
}
function aiShortcut(k){setTab('ai');db.aiHistory.push({role:'user',text:k});db.aiHistory.push({role:'bot',text:prompts[k]||'พร้อมช่วยครับ'});save();renderAI();setTimeout(()=>scrollTo(0,document.body.scrollHeight),50)}
async function sendAI(){
  const el=document.getElementById('aiInput');const msg=el?.value.trim();if(!msg)return;
  db.aiHistory.push({role:'user',text:msg});save();renderAI();
  let reply='';
  if(db.profile.webhookUrl){
    try{
      const r=await fetch(db.profile.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,groupId:db.profile.defaultGroup,userId:'local-user'})});
      const j=await r.json();reply=j.reply||j.message||JSON.stringify(j);
    }catch(e){reply='เชื่อม Webhook ไม่สำเร็จ จึงใช้ผู้ช่วยในเครื่องแทนครับ\n\n'+localAI(msg)}
  }else reply=localAI(msg);
  db.aiHistory.push({role:'bot',text:reply});save();renderAI();setTimeout(()=>scrollTo(0,document.body.scrollHeight),50)
}
function localAI(m){
  const s=m.toLowerCase();
  if(s.includes('โพสต์'))return prompts['เขียนโพสต์'];
  if(s.includes('ไอเดีย'))return prompts['คิดไอเดีย'];
  if(s.includes('สรุป'))return prompts['สรุปข้อมูล'];
  if(s.includes('แผน'))return prompts['วางแผน'];
  if(s.includes('เตือน'))return prompts['ตั้งเตือน'];
  if(s.includes('ภาพ'))return prompts['สร้างภาพ'];
  return 'รับคำสั่งแล้วครับ: “'+m+'”\n\nเวอร์ชันนี้ทำงานออฟไลน์ จึงตอบด้วยผู้ช่วยพื้นฐานก่อน หากต้องการ AI จริง ให้ใส่ Webhook URL ที่หน้า บัญชี → การเชื่อมต่อ';
}
