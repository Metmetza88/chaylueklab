<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รวมคนสตึก | Satuek Hub</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;background:#f5f7fb;color:#172033}header{position:sticky;top:0;background:white;padding:16px;box-shadow:0 2px 10px #0001;z-index:2}main{max-width:850px;margin:auto;padding:16px 16px 110px}h1{font-size:25px;margin:0 0 12px}input,select,textarea,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #cdd6e4;width:100%;font-size:17px}button{cursor:pointer;background:#0d6557;color:white;border:0;font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb000}.row{display:flex;gap:8px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}.tabs button{background:#e6eeec;color:#173f37}.tabs button.active{background:#0d6557;color:white}.card{background:white;padding:17px;border-radius:17px;margin:12px 0;box-shadow:0 2px 8px #0001}.badge{display:inline-block;background:#e4f5eb;color:#126b40;padding:4px 10px;border-radius:20px}.muted{color:#536273}.actions{display:flex;gap:8px;margin-top:12px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;background:#0d6557;color:white;padding:12px;border-radius:10px}.float{position:fixed;bottom:18px;right:18px;width:auto;padding:16px 24px;box-shadow:0 5px 18px #0004}dialog{border:0;border-radius:18px;width:min(95vw,520px);padding:24px}dialog::backdrop{background:#0008}label{display:block;margin:10px 0;font-weight:500}small{display:block;color:#526174}progress{width:100%;height:16px} .hidden{display:none}</style></head><body><header><h1>🏘️ รวมคนสตึก</h1><div class="row"><select id="area" aria-label="เลือกตำบล"><option value="">ทุกตำบลในอำเภอ</option><option>สตึก</option><option>นิคม</option><option>ท่าม่วง</option><option>ร่อนทอง</option></select></div><input id="search" style="margin-top:9px" placeholder="ค้นหาของกิน ช่างซ่อม รถรับจ้าง ข่าวอำเภอ..." aria-label="ค้นหา"></header><main><p class="muted">ตลาดและข่าวสารชุมชน แยกหมวดหมู่ ไม่ต้องไล่หาข้อความในกลุ่ม</p><div class="tabs" id="tabs"></div><div id="results" aria-live="polite"></div><p class="muted">รุ่นสาธิต: ข้อมูลประกาศเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ยังไม่มีระบบรับเงินจริงหรือเชื่อม LINE</p></main><button class="float" id="add">＋ ลงประกาศ</button><dialog id="modal"><h2>ลงประกาศใหม่</h2><form id="form"><label>หมวดหมู่<select name="type" required><option value="food_market">ของกินและสั่งจอง</option><option value="local_service">ช่างและบริการ</option><option value="secondhand_or_farm">ซื้อขายชุมชน</option><option value="district_news">ข่าวสารอำเภอ</option></select></label><label>ตำบล<select name="area" required><option>สตึก</option><option>นิคม</option><option>ท่าม่วง</option><option>ร่อนทอง</option></select></label><label>หัวข้อ<input name="title" maxlength="100" required></label><label>รายละเอียด<textarea name="description" maxlength="500"></textarea></label><label>ราคา (บาท)<input name="price" type="number" min="0" step="0.01"></label><label>เบอร์โทร<input name="phone" type="tel" pattern="[0-9+ -]{9,16}"></label><label>จำนวนรับจองสูงสุด (เว้นว่างหากไม่รับจอง)<input name="quota" type="number" min="1"></label><div class="actions"><button type="submit">บันทึกประกาศ</button><button type="button" id="close" style="background:#64748b">ยกเลิก</button></div></form></dialog><script>const categories=[['food_market','🍜 ของกิน & สั่งจอง'],['local_service','🔧 ช่าง & บริการ'],['secondhand_or_farm','🌾 ซื้อขายชุมชน'],['district_news','📣 ข่าวอำเภอ']];const demo=[{id:1,type:'food_market',title:'ข้าวกล่องทำใหม่',description:'รับของเวลา 16:00 น.',price:45,area:'สตึก',quota:10,orders:8,status:'active',phone:''},{id:2,type:'local_service',title:'บริการช่างซ่อมในพื้นที่',description:'โทรสอบถามรายละเอียดก่อนนัดหมาย',area:'นิคม',status:'active',phone:''}];let tab='food_market';let listings;try{listings=JSON.parse(localStorage.getItem('satuek-demo')||'null')||demo}catch{listings=demo}const $=id=>document.getElementById(id);function save(){localStorage.setItem('satuek-demo',JSON.stringify(listings))}function node(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}function render(){ $('tabs').replaceChildren();categories.forEach(([id,label])=>{const b=node('button',label);b.className=id===tab?'active':'';b.onclick=()=>{tab=id;render()};$('tabs').append(b)});$('results').replaceChildren();const q=$('search').value.trim().toLocaleLowerCase('th');const found=listings.filter(x=>x.type===tab&&(!$('area').value||x.area===$('area').value)&&(!q||(x.title+' '+x.description).toLocaleLowerCase('th').includes(q)));if(!found.length)$('results').append(node('p','ยังไม่มีประกาศในหมวดนี้'));found.forEach(x=>{const card=node('article','');card.className='card';const h=node('h2',x.title);card.append(h,node('span',x.status==='sold_out'?'หมดแล้ว':x.status==='closed'?'ปิดรับจอง':'เปิดอยู่'),node('p',x.description||''),node('p','📍 ตำบล'+x.area+(x.price!=null?' · '+x.price+' บาท':'')));card.children[1].className='badge';if(x.quota){card.append(node('p','จองแล้ว '+(x.orders||0)+'/'+x.quota));const p=document.createElement('progress');p.max=x.quota;p.value=x.orders||0;card.append(p)}const a=document.createElement('div');a.className='actions';if(x.phone){const tel=node('a','โทรเลย');tel.href='tel:'+x.phone.replace(/[^0-9+]/g,'');a.append(tel)}if(x.quota&&x.status==='active'){const b=node('button','กดสั่งจอง (สาธิต)');b.onclick=()=>{if((x.orders||0)>=x.quota)return;x.orders=(x.orders||0)+1;if(x.orders>=x.quota)x.status='sold_out';save();render()};a.append(b)}if(x.local){const b=node('button','ปิดการขาย');b.onclick=()=>{x.status='closed';save();render()};a.append(b)}card.append(a);$('results').append(card)})}$('area').onchange=render;$('search').oninput=render;$('add').onclick=()=>$('modal').showModal();$('close').onclick=()=>$('modal').close();$('form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);const x={id:Date.now(),type:d.get('type'),area:d.get('area'),title:d.get('title'),description:d.get('description'),price:d.get('price')?Number(d.get('price')):null,phone:d.get('phone'),quota:d.get('quota')?Number(d.get('quota')):null,orders:0,status:'active',local:true};listings.unshift(x);save();tab=x.type;$('modal').close();e.target.reset();render()};render();</script></body></html>
