<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WORAMET Creator & Commerce Hub — MVP</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#070e1b;color:#e9f5ff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:720px;margin:auto}h1{font-size:clamp(24px,5vw,38px);margin-bottom:6px}p,small{color:#a7b7ce}section{background:#101b30;border:1px solid #29415e;border-radius:18px;padding:20px;margin:18px 0}label{display:block;margin:15px 0 6px;font-weight:600}input,textarea{width:100%;background:#091426;color:white;border:1px solid #49617b;border-radius:10px;padding:13px;font:inherit}textarea{min-height:100px}button{cursor:pointer;border-radius:10px;padding:12px 15px;border:1px solid #4d6886;background:#1c2b44;color:white;font:inherit;min-height:44px}.primary{background:#32d9bc;color:#041a20;font-weight:800;border:0;width:100%;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{display:flex;gap:8px;align-items:center;padding:10px;background:#0b1628;border-radius:10px}.choice input{width:auto;accent-color:#32d9bc}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#081323;border:1px solid #2a455c;border-radius:12px;padding:15px;font:14px/1.7 system-ui}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{color:#72e5ce}footer{font-size:12px;color:#96a9c2;margin:25px 0}</style></head><body><main>
<p class="status">WORAMET AI LAB / DOJO MVP / LOCAL DEMO</p><h1>Creator & Commerce Hub</h1><p>เตรียมแคปชั่นขายของหลายช่องทางในครั้งเดียว — ยังไม่เชื่อมบัญชีและไม่เผยแพร่โพสต์จริง</p>
<section><h2>1. ข้อมูลโพสต์</h2><label for="name">ชื่อสินค้าหรือคอนเทนต์</label><input id="name" maxlength="150" placeholder="เช่น เสื้อโปโล FIRST CHAPTER"><label for="detail">รายละเอียดและจุดขาย</label><textarea id="detail" maxlength="2000" placeholder="เช่น เนื้อผ้านุ่ม มี 3 สี"></textarea><label for="price">ราคา (บาท) — ไม่บังคับ</label><input id="price" type="number" min="0" step="0.01" placeholder="419"></section>
<section><h2>2. เลือกช่องทาง</h2><div class="grid" id="platforms"></div></section>
<section><h2>3. สร้างข้อความ</h2><button class="primary" id="generate">สร้างแคปชั่นสำหรับช่องทางที่เลือก</button><p id="message" role="status" aria-live="polite"></p><div id="results"></div><div class="actions"><button id="copy">คัดลอกทั้งหมด</button><button id="download">ดาวน์โหลด TXT</button><button id="json">ดาวน์โหลด JSON</button></div></section>
<footer>ต้นแบบแบบออฟไลน์: ใช้กฎสร้างข้อความ ไม่เรียก AI API ไม่อัปโหลดข้อมูล และไม่โพสต์แทนผู้ใช้</footer>
</main><script>
'use strict';
const channels=['YouTube','Facebook','Instagram','TikTok','Shopee','Lazada'];let generated=[];
const $=id=>document.getElementById(id);
channels.forEach((c,i)=>{const l=document.createElement('label');l.className='choice';const input=document.createElement('input');input.type='checkbox';input.value=c;input.checked=i<4;l.append(input,document.createTextNode(c));$('platforms').append(l)});
const clean=s=>String(s||'').trim();
function build(c,name,detail,price){const hashtag='#รีวิวสินค้า #ของดีบอกต่อ';const base=name+'\n'+detail+(price?'\nราคา ฿'+Number(price).toLocaleString('th-TH',{maximumFractionDigits:2}):'');switch(c){case 'YouTube':return 'รู้จัก '+name+' ในคลิปนี้\n'+base+'\nติดตามเพื่อดูผลงานใหม่ ๆ\n#YouTubeShorts '+hashtag;case 'TikTok':return name+' น่าสนใจยังไง?\n'+base+'\n#TikTok '+hashtag;case 'Instagram':return '✨ '+name+'\n'+base+'\n#Instagram '+hashtag;case 'Facebook':return 'แนะนำ '+name+'\n'+base+'\nสอบถามรายละเอียดเพิ่มเติมได้ทางข้อความ\n'+hashtag;default:return name+'\n'+base+'\nกรุณาตรวจสอบรายละเอียดสินค้า ราคา และเงื่อนไขก่อนลงขาย';}}
function exportText(){return generated.map(x=>'['+x.platform+']\n'+x.caption).join('\n\n----------------\n\n')}
function save(name,type,content){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('generate').onclick=()=>{const name=clean($('name').value),detail=clean($('detail').value),price=$('price').value,selected=[...document.querySelectorAll('#platforms input:checked')].map(x=>x.value);if(!name||!detail||!selected.length){$('message').textContent='กรุณาใส่ชื่อ รายละเอียด และเลือกอย่างน้อย 1 ช่องทาง';return}generated=selected.map(platform=>({platform,caption:build(platform,name,detail,price)}));$('results').replaceChildren();generated.forEach(x=>{const h=document.createElement('h3');h.textContent=x.platform;const pre=document.createElement('pre');pre.textContent=x.caption;$('results').append(h,pre)});$('message').textContent='เตรียมข้อความแล้ว '+generated.length+' ช่องทาง (ยังไม่ได้โพสต์จริง)'};
$('copy').onclick=async()=>{if(!generated.length){$('message').textContent='สร้างข้อความก่อน';return}try{await navigator.clipboard.writeText(exportText());$('message').textContent='คัดลอกแล้ว'}catch(e){$('message').textContent='คัดลอกไม่ได้ในเบราว์เซอร์นี้ โปรดเลือกข้อความจากผลลัพธ์แทน'}};
$('download').onclick=()=>{if(generated.length)save('woramet-posts.txt','text/plain;charset=utf-8',exportText());else $('message').textContent='สร้างข้อความก่อน'};
$('json').onclick=()=>{if(generated.length)save('woramet-posts.json','application/json;charset=utf-8',JSON.stringify({version:'mvp-1',posts:generated},null,2));else $('message').textContent='สร้างข้อความก่อน'};
</script></body></html>
