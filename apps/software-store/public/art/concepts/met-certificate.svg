<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">MET Certificate — ภาพจำลองหน้าจอ</title>
<desc id="desc">ออกเกียรติบัตรภาษาไทย — ภาพแนวคิดและข้อมูลสมมติ ไม่ใช่ภาพหน้าจอระบบจริง</desc>
