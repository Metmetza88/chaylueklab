<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAYLUEKLAB AI Gallery</title><style>body{margin:0;background:#faf9f5;color:#252525;font:16px system-ui}header,main{padding:24px;max-width:1000px;margin:auto}header{display:flex;justify-content:space-between}h1{font-size:42px}input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}button{padding:11px 17px;border:1px solid #ddd;background:white;border-radius:24px;margin:5px;cursor:pointer}button.active{background:#ffdb62;border-color:#ffdb62}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:20px}.card{background:white;border:1px solid #eee;border-radius:18px;padding:18px}.visual{height:130px;background:linear-gradient(130deg,#d6e4e0,#f8d9a8);border-radius:12px;display:grid;place-items:center;font-size:52px}.muted{color:#737373;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f5f0;padding:16px;border-radius:12px}dialog{border:0;border-radius:18px;max-width:500px;width:85%}dialog::backdrop{background:#0008}</style></head><body><header><strong>CHAYLUEKLAB AI</strong><a href="../">กลับหน้าแรก</a></header><main><p class="muted">CREATIVE AI STUDIO · PREVIEW</p><h1>Prompt Gallery</h1><p>คลังคำสั่ง AI สำหรับภาพ วิดีโอ สินค้า และแฟชั่น</p><input id="search" placeholder="ค้นหา Prompt" aria-label="ค้นหา Prompt"><div id="filters"></div><p class="muted" id="count"></p><section class="grid" id="cards"></section><p class="muted">เวอร์ชันทดลอง: คัดลอก Prompt ได้ ยังไม่ได้เชื่อม AI API หรือระบบชำระเงิน</p></main><dialog id="modal"><button id="close">ปิด</button><h2 id="title"></h2><pre id="prompt"></pre><button id="copy">คัดลอก Prompt</button></dialog><script>
const items=[
{title:"Fashion Editorial",type:"ภาพ",cat:"แฟชั่น",icon:"👕",ratio:"3:4",prompt:"Professional fashion editorial photo using the exact reference garment. Preserve collar, logo, stripes, texture and original colors. Natural light, minimalist setting, 3:4 portrait."},
{title:"Product Studio",type:"ภาพ",cat:"สินค้า",icon:"📦",ratio:"1:1",prompt:"Premium studio product photograph. Preserve the original product label, shape and color. Soft lighting, clean beige backdrop, crisp details, square format."},
{title:"Launch Poster",type:"ภาพ",cat:"โปสเตอร์",icon:"✨",ratio:"4:5",prompt:"Minimal premium collection launch poster, three distinct product variants displayed separately, dramatic soft lighting, generous space for a headline, 4:5 portrait."},
{title:"LINE Sticker",type:"ภาพ",cat:"สติกเกอร์",icon:"💬",ratio:"1:1",prompt:"Single expressive 3D sticker character, glossy toy material, transparent background, clean silhouette, wide safe margins, square format."},
{title:"Food Commercial",type:"ภาพ",cat:"อาหาร",icon:"🍜",ratio:"4:5",prompt:"Photorealistic Thai food commercial, authentic ingredients, appetizing plating, natural warm light, realistic texture, portrait 4:5."},
{title:"Product Video",type:"วิดีโอ",cat:"สินค้า",icon:"🎬",ratio:"9:16",prompt:"Vertical 9:16 product commercial, eight seconds, close-up opening, gentle camera orbit, final hero shot. Preserve original product and branding."},
{title:"Fashion Video",type:"วิดีโอ",cat:"แฟชั่น",icon:"🎞️",ratio:"9:16",prompt:"Cinematic vertical fashion video, model walking outdoors, natural garment movement, soft daylight, preserve supplied clothing design, ten seconds."},
{title:"Business Video",type:"วิดีโอ",cat:"ธุรกิจ",icon:"📈",ratio:"16:9",prompt:"Professional small business explainer video showing inquiry, order, packing and delivery, clean transitions, authentic Thai retail setting, 16:9."}
];let filter="ทั้งหมด",term="";const el=id=>document.getElementById(id);function render(){const f=el("filters");f.replaceChildren();["ทั้งหมด","ภาพ","วิดีโอ","แฟชั่น","สินค้า","โปสเตอร์","สติกเกอร์","อาหาร","ธุรกิจ"].forEach(v=>{const b=document.createElement("button");b.textContent=v;b.className=filter===v?"active":"";b.onclick=()=>{filter=v;render()};f.append(b)});const data=items.filter(x=>(filter==="ทั้งหมด"||x.type===filter||x.cat===filter)&&(x.title+" "+x.cat+" "+x.prompt).toLowerCase().includes(term));el("count").textContent=data.length+" รายการ";const c=el("cards");c.replaceChildren();data.forEach(x=>{const card=document.createElement("article");card.className="card";const visual=document.createElement("div");visual.className="visual";visual.textContent=x.icon;const h=document.createElement("h2");h.textContent=x.title;const p=document.createElement("p");p.className="muted";p.textContent=x.type+" · "+x.cat+" · "+x.ratio;const b=document.createElement("button");b.textContent="ดู Prompt";b.onclick=()=>{el("title").textContent=x.title;el("prompt").textContent=x.prompt;el("copy").onclick=()=>navigator.clipboard.writeText(x.prompt);el("modal").showModal()};card.append(visual,h,p,b);c.append(card)})}el("search").oninput=e=>{term=e.target.value.toLowerCase();render()};el("close").onclick=()=>el("modal").close();render();</script></body></html>
